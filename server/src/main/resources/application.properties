spring.application.name = minesweeper-server
server.port = ${PORT:8080}

spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/minesweeper?serverTimezone=UTC}
spring.datasource.username = ${DB_USER:root}
spring.datasource.password = ${DB_PASSWORD}

spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:db/schema.sql

spring.config.import = optional:file:./application-local.properties,optional:file:./server/application-local.properties